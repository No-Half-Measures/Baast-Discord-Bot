{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Baast{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="https://cdn.discordapp.com/icons/MAIN_GUILD_ID/14e739ee2cc4de1a5f35e6d58077cbd4.png">
    <!-- CSS only -->

    <link href="{% static 'style.css' %}" rel="stylesheet" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css" rel="stylesheet" type="text/css">

    <script src="https://js.stripe.com/v3/"></script>

    {% comment %} <script async src="https://js.stripe.com/v3/pricing-table.js"></script> {% endcomment %}
</head>

<body class="bg-cream">
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
    <symbol id="check" viewBox="0 0 16 16">
        <title>Check</title>
        <path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/>
    </symbol>
    </svg>

    {% include 'app/header_menu.html' %}
    <main style="min-height: calc(100vh - 330px)">
        <div class="container py-4">
            <div class="row mb-3 p-5 justify-content-center">
                <div class="col-md-2"></div>
                <div class="col-md-2">
                    <h1 class="display-4 fw-normal depth text-cream error">404</h1>
                    <sub class="float-center">Error page not found</sub>
                </div>
                <div class="col-md-2"></div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    {% include 'app/footer.html' %}

    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <!-- JavaScript Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>

    <script>
        feather.replace({ 'aria-hidden': 'true' })
    </script>
</body>
</html>
