{% extends "discord/dash_base.html" %} 

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold">{% if post %}Edit Post{% else %}Create New Post{% endif %}</h1>
            <a href="{% url 'discord:admin_blog_list' %}" class="text-blue-600 hover:text-blue-800">
                ← Back to Posts
            </a>
        </div>

        <form method="POST" enctype="multipart/form-data" class="bg-white rounded-lg shadow-md p-6">
            {% csrf_token %}
            
            <div class="mb-6">
                <label for="title" class="block text-sm font-medium text-gray-700 mb-2">Title</label>
                <input type="text" name="title" id="title" value="{{ post.title|default:'' }}" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="mb-6">
                <label for="post_type" class="block text-sm font-medium text-gray-700 mb-2">Post Type</label>
                <select name="post_type" id="post_type" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    {% for value, label in post_types.items %}
                    <option value="{{ value }}" {% if post.post_type == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-6">
                <label for="content" class="block text-sm font-medium text-gray-700 mb-2">Content</label>
                <textarea name="content" id="content" rows="15" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">{{ post.content|default:'' }}</textarea>
            </div>

            <div class="mb-6">
                <label for="featured_image" class="block text-sm font-medium text-gray-700 mb-2">Featured Image</label>
                {% if post.featured_image %}
                <div class="mb-2">
                    <img src="{{ post.featured_image.url }}" alt="Current featured image" class="h-32 w-auto">
                </div>
                {% endif %}
                <input type="file" name="featured_image" id="featured_image" accept="image/*"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="my-6">
                <label class="flex items-center">
                    <input type="checkbox" name="is_published" {% if post.is_published %}checked{% endif %}
                        class="rounded border-gray-300 text-blue-600 shadow-sm focus:border-blue-300 focus:ring focus:ring-blue-200 focus:ring-opacity-50">
                    <span class="ml-2 text-sm text-gray-700">Publish immediately</span>
                </label>
                {% if post == None %}
                <label class="flex items-center">
                    <input type="checkbox" name="push_to_discord" checked
                        class="rounded border-gray-300 text-blue-600 shadow-sm focus:border-blue-300 focus:ring focus:ring-blue-200 focus:ring-opacity-50">
                    <span class="ml-2 text-sm text-gray-700">Push to Discord</span>
                </label>
                {% endif %}
            </div>

            <div class="flex justify-end">
                <button type="submit" class="btn btn-success" onclick="location.href='{% url 'discord:admin_blog_create' %}'">
                    {% if post %}Save Changes{% else %}Create Post{% endif %}
                </button>
            </div>
        </form>
    </div>
</div>

<!-- TinyMCE Script -->
<script src="https://cdn.jsdelivr.net/npm/tinymce@6/tinymce.min.js"></script>
<script>
    tinymce.init({
        selector: '#content',
        height: 500,
        menubar: false,
        plugins: [
            'advlist', 'autolink', 'lists', 'link', 'image', 'charmap', 'preview',
            'anchor', 'searchreplace', 'visualblocks', 'code', 'fullscreen',
            'insertdatetime', 'media', 'table', 'help', 'wordcount'
        ],
        toolbar: 'undo redo | blocks | bold italic underline strikethrough | ' +
                'alignleft aligncenter alignright alignjustify | ' +
                'bullist numlist outdent indent | removeformat | ' +
                'link image media | table | code preview fullscreen | help',
        content_style: 'body { font-family: -apple-system, BlinkMacSystemFont, San Francisco, Segoe UI, Roboto, Helvetica Neue, sans-serif; font-size: 14px; line-height: 1.4; }',
        block_formats: 'Paragraph=p; Header 1=h1; Header 2=h2; Header 3=h3; Header 4=h4; Header 5=h5; Header 6=h6; Preformatted=pre',
        image_advtab: true,
        link_assume_external_targets: true,
        file_picker_types: 'image',
        automatic_uploads: true,
        images_upload_handler: function (blobInfo, success, failure) {
            var xhr, formData;
            xhr = new XMLHttpRequest();
            xhr.withCredentials = false;
            xhr.open('POST', '{% url "discord:admin_upload_image" %}');
            xhr.onload = function() {
                var json;
                if (xhr.status !== 200) {
                    failure('HTTP Error: ' + xhr.status);
                    return;
                }
                json = JSON.parse(xhr.responseText);
                if (!json || typeof json.location !== 'string') {
                    failure('Invalid JSON: ' + xhr.responseText);
                    return;
                }
                success(json.location);
            };
            formData = new FormData();
            formData.append('file', blobInfo.blob(), blobInfo.filename());
            formData.append('csrfmiddlewaretoken', document.querySelector('[name=csrfmiddlewaretoken]').value);
            xhr.send(formData);
        }
    });
</script>
{% endblock %}
