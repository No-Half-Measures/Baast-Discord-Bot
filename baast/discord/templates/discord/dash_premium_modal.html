<div class="modal fade panel-modal panel-modal-premium" tabindex="-1" id="premiumModal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">This is a premium feature.</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p>Upgrade to Baast Plus to unlock this feature and get access to templates, presets, recurring events, and more.</p>
            </div>
            <div class="modal-footer">
                <button type="button" id="cancel" class="btn btn-danger" data-bs-dismiss="modal">Cancel</button>
                <button type="button" id="confirm" class="btn btn-primary" onclick="window.location.href='{% url 'events:pricing' %}'">Upgrade</button>
            </div>
        </div>
    </div>
</div>
