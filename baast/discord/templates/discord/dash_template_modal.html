<div class="modal fade panel-modal" tabindex="-1" id="templateModal">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalHead">Creating Template...</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-danger" role="alert" id="ntempAlert" hidden>Error: ...............</div>

                <div class="panel-field panel-field-wide input-group mb-0">
                    <div class="input-group-prepend">
                        <span class="input-group-text justify-content-end">Name</span>
                    </div>
                    <input type="text" class="form-control" aria-label="name" autocomplete="off" value="" maxlength="100" minlength="1" id="tempName">
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-success" onclick="Create('{{nav_data.hash}}')" id="tempCreate">Save</button>
            </div>
        </div>
    </div>
</div>
