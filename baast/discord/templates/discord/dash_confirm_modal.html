<div class="modal fade panel-modal" tabindex="-1" id="confirmModal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Are you sure?</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mention-options is-hidden">
                    <div class="panel-field input-group">
                        <span class="input-group-text justify-content-end">Mention</span>
                        <select class="selectpicker form-control" aria-label="Select role(s)" id="reMention" multiple data-max-options="20" data-none-selected-text="None" data-width="auto">
                            {% for role in roles %}
                                <option value='{{role.discord_id}}'>{{role.discord_name}}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="channels-options is-hidden">
                    <div class="panel-field input-group">
                        <span class="input-group-text justify-content-end">Channel</span>
                        <select class="form-select" aria-label="Select a channel to post the event in:" id="neChannels">
                            {% for channel in channels %}
                                {% if channel.discord_id in nav_data.conf.event_channels %}
                                <option value='{{channel.discord_id}}'>{{channel.name}}</option>
                                {% endif %}
                            {% endfor %}

                            {% for channel in channels %}
                                {% if channel.discord_id not in nav_data.conf.event_channels %}
                                <option value='{{channel.discord_id}}'>{{channel.name}}</option>
                                {% endif %}
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <p class="mb-0"></p>

                <div class="restore-signups is-hidden">
                    <div class="panel-field input-group mb-0">
                        <span class="input-group-text justify-content-end">Restore Signups</span>
                        <input id="restoreSignups" type="checkbox" checked data-toggle="toggle" data-onstyle="outline-primary" data-offstyle="outline-secondary" autocomplete="off">
                    </div>
                </div>

                <div class="template-options is-hidden">
                    <div class="panel-field input-group">
                        <span class="input-group-text justify-content-end">Template</span>
                        <select class="form-select" id="restoreTemplate">
                        </select>
                    </div>
                    <div class="panel-field input-group">
                        <span class="input-group-text justify-content-end">Option Preset</span>
                        <select class="form-select" id="restoreOption" disabled>
                        </select>
                    </div>
                    <div class="panel-field input-group mb-0">
                        <span class="input-group-text justify-content-end">Roleset</span>
                        <select class="form-select" id="restoreRoleset" disabled>
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" id="m_cancel" class="btn btn-danger" data-bs-dismiss="modal">Cancel</button>
                <button type="button" id="m_confirm" class="btn btn-success">Confirm</button>
            </div>
        </div>
    </div>
</div>
