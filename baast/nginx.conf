# nginx.conf 

user  nginx;
#worker_processes  1;

#error_log /dev/stdout info;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;



events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  5s;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" $status '
        '$body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    upstream baast {
        server baast-web:8000;
    }

    upstream faro {
        server alloy:12347;
    }
	
	#http to https forward
	server {
		listen 80;
		server_name baast.app www.baast.app;
		
		# Let's Encrypt challenge - must be HTTP, not HTTPS
		# Use ^~ to prioritize this prefix match and prevent fallthrough
		location ^~ /.well-known/acme-challenge/ {
			root /var/www/certbot;
			allow all;
			try_files $uri =404;
		}

		# Redirect all other traffic to HTTPS
		location / {
			return 301 https://$host$request_uri;
		}		
	}
	
    # Default server block for HTTP - reject all other hostnames
	server {
		listen 80 default_server;
		server_name _;
		return 444; # Connection closed without response
	}

    server {
        #listen 80;
		#listen [::]:80;
		listen 443 ssl;
        server_name baast.app;
		
		ssl_certificate /etc/letsencrypt/live/baast.app-0002/fullchain.pem;
		ssl_certificate_key /etc/letsencrypt/live/baast.app-0002/privkey.pem;
		
		include /etc/letsencrypt/options-ssl-nginx.conf;
		ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
		
		
        # Grafana Faro Web SDK collector (native /collect endpoint)
        location /collect {
            proxy_pass         http://faro/collect;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            client_max_body_size 5m;
        }

		location / {
            proxy_redirect     off;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $server_name;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_pass http://baast;
        }

        location /static/ {
            autoindex on;
            alias /static/;
        }

        location /media/ {
            autoindex on;
            alias /media/;
        }
    }

    # invite.baast.app -> Discord bot OAuth
    server {
        listen 80;
        server_name invite.baast.app;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
            try_files $uri =404;
        }

        location / {
            return 301 "https://discord.com/oauth2/authorize?client_id=916817181088571433&permissions=377957256192&scope=applications.commands%20bot";
        }
    }

    server {
        listen 443 ssl;
        server_name invite.baast.app;

        ssl_certificate /etc/letsencrypt/live/baast.app-0002/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/baast.app-0002/privkey.pem;

        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location / {
            return 301 "https://discord.com/oauth2/authorize?client_id=916817181088571433&permissions=377957256192&scope=applications.commands%20bot";
        }
    }

    # discord.baast.app -> Discord server invite
    server {
        listen 80;
        server_name discord.baast.app;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
            try_files $uri =404;
        }

        location / {
            return 301 "https://discord.gg/RNrA9Gtxmm";
        }
    }

    server {
        listen 443 ssl;
        server_name discord.baast.app;

        ssl_certificate /etc/letsencrypt/live/baast.app-0002/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/baast.app-0002/privkey.pem;

        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location / {
            return 301 "https://discord.gg/RNrA9Gtxmm";
        }
    }


    # Grafana
    upstream grafana {
        server grafana:3000;
    }

    server {
        listen 80;
        server_name monitoring.baast.app;
        
        # Let's Encrypt challenge - must be HTTP, not HTTPS
        # Use ^~ to prioritize this prefix match and prevent fallthrough
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
            try_files $uri =404;
        }
        
        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name monitoring.baast.app;
        
        # Use the same SSL certificate as main domain for now
        # You can generate a separate one for monitoring.baast.app later
        ssl_certificate /etc/letsencrypt/live/baast.app-0002/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/baast.app-0002/privkey.pem;
        
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
        
        location / {
            proxy_redirect     off;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $server_name;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_pass http://grafana;
        }
    }



    # Default server block for HTTPS - reject all other hostnames
    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_certificate /etc/letsencrypt/live/baast.app-0002/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/baast.app-0002/privkey.pem;
        return 444; # Connection closed without response
    }
}